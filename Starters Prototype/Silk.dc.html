<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<span style="display: inline-flex; line-height: 0;">{{ svg }}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:120},&quot;spec&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:40,&quot;tsType&quot;:&quot;number&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Silks&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  uid = 'sk' + Math.random().toString(36).slice(2, 8);
  HEX = {
    'red':'#D7182A','maroon':'#7A1F33','cerise':'#D6246E','pink':'#F4A6C4','mauve':'#B48CC0','purple':'#5B2A86',
    'royal blue':'#1F4FBF','dark blue':'#152452','light blue':'#8EC3EA','emerald green':'#00875A','dark green':'#0C4A2C','light green':'#86C96F',
    'yellow':'#F6D20A','orange':'#F07F13','brown':'#6B4423','beige':'#E3D3B0','grey':'#9AA0A6','white':'#FFFFFF','black':'#141414','gold':'#D4A017','navy':'#152452','emerald':'#00875A'
  };
  renderVals() {
    const h = React.createElement, c = this.props.spec || {}, size = Number(this.props.size) || 40;
    const X = (n) => this.HEX[n] || n || '#E4E4E7';
    const id = this.uid;
    const body = X(c.body), two = X(c.second || 'white'), sl = X(c.sleeves || c.body), cap = X(c.cap || c.body), cap2 = X(c.cap2 || 'white');
    const stroke = { stroke: '#3F3F46', strokeWidth: 1.2, strokeLinejoin: 'round' };
    const BODY = 'M32 27 L43 23 Q50 29 57 23 L68 27 L70 96 L30 96 Z';
    const LS = 'M32 27 L13 58 L22 65 L33 45 Z', RS = 'M68 27 L87 58 L78 65 L67 45 Z';
    const DOME = 'M35 17 C35 3 65 3 65 17 Z';
    const pat = (p, col) => {
      const f = { fill: col };
      switch (p) {
        case 'hoops': return [36, 54, 72, 88].map((y, i) => h('rect', { key: i, x: 0, y, width: 100, height: 8, ...f }));
        case 'stripes': return [33, 42, 51, 60].map((x, i) => h('rect', { key: i, x, y: 0, width: 4.5, height: 100, ...f }));
        case 'braces': return [40, 56].map((x, i) => h('rect', { key: i, x, y: 0, width: 4.5, height: 100, ...f }));
        case 'sash': return [h('line', { key: 0, x1: 36, y1: 22, x2: 72, y2: 98, stroke: col, strokeWidth: 11 })];
        case 'cross belts': return [h('line', { key: 0, x1: 34, y1: 22, x2: 70, y2: 98, stroke: col, strokeWidth: 7 }), h('line', { key: 1, x1: 66, y1: 22, x2: 30, y2: 98, stroke: col, strokeWidth: 7 })];
        case 'star': return [h('polygon', { key: 0, points: '50,46 53.5,56 64,56 55.5,62 58.7,72 50,66 41.3,72 44.5,62 36,56 46.5,56', ...f })];
        case 'diamond': return [h('polygon', { key: 0, points: '50,42 62,60 50,78 38,60', ...f })];
        case 'disc': return [h('circle', { key: 0, cx: 50, cy: 60, r: 11, ...f })];
        case 'chevrons': return [40, 58, 76].map((y, i) => h('polyline', { key: i, points: `28,${y} 50,${y + 12} 72,${y}`, fill: 'none', stroke: col, strokeWidth: 6 }));
        case 'spots': return [[39,40],[61,40],[50,52],[39,64],[61,64],[50,76],[39,88],[61,88]].map(([x, y], i) => h('circle', { key: i, cx: x, cy: y, r: 3.6, ...f }));
        case 'halved': return [h('rect', { key: 0, x: 50, y: 0, width: 50, height: 100, ...f })];
        case 'quartered': return [h('rect', { key: 0, x: 50, y: 0, width: 50, height: 60, ...f }), h('rect', { key: 1, x: 0, y: 60, width: 50, height: 40, ...f })];
        default: return [];
      }
    };
    const capPat = (p) => {
      const f = { fill: cap2 };
      if (p === 'hooped') return [h('rect', { key: 0, x: 30, y: 8, width: 40, height: 4, ...f })];
      if (p === 'quartered') return [h('rect', { key: 0, x: 50, y: 0, width: 20, height: 10, ...f }), h('rect', { key: 1, x: 30, y: 10, width: 20, height: 10, ...f })];
      if (p === 'star') return [h('polygon', { key: 0, points: '50,6 51.8,10.4 56.5,10.4 52.7,13.2 54.1,17 50,14.6 45.9,17 47.3,13.2 43.5,10.4 48.2,10.4', ...f })];
      if (p === 'spots') return [[42,13],[50,9],[58,13]].map(([x, y], i) => h('circle', { key: i, cx: x, cy: y, r: 2, ...f }));
      if (p === 'striped') return [42, 49, 56].map((x, i) => h('rect', { key: i, x, y: 0, width: 3, height: 20, ...f }));
      return [];
    };
    const slPat = c.sleevePattern === 'hooped' ? [44, 54].map((y, i) => h('rect', { key: i, x: 0, y, width: 100, height: 5, fill: X(c.sleeve2 || 'white') })) : [];
    const svg = h('svg', { width: size, height: size, viewBox: '0 0 100 100', role: 'img', 'aria-label': this.props.label || 'Silks' },
      h('defs', null,
        h('clipPath', { id: id + 'b' }, h('path', { d: BODY })),
        h('clipPath', { id: id + 's' }, h('path', { d: LS + ' ' + RS })),
        h('clipPath', { id: id + 'c' }, h('path', { d: DOME }))),
      h('path', { d: LS + ' ' + RS, fill: sl }),
      h('g', { clipPath: `url(#${id}s)` }, slPat),
      h('path', { d: LS + ' ' + RS, fill: 'none', ...stroke }),
      h('path', { d: BODY, fill: body }),
      h('g', { clipPath: `url(#${id}b)` }, pat(c.pattern, two)),
      h('path', { d: BODY, fill: 'none', ...stroke }),
      h('path', { d: DOME, fill: cap }),
      h('g', { clipPath: `url(#${id}c)` }, capPat(c.capPattern)),
      h('path', { d: DOME, fill: 'none', ...stroke }),
      h('path', { d: 'M35 17 L65 17 L72 20.5 L35 20.5 Z', fill: cap, ...stroke }));
    return { svg };
  }
}
</script>
